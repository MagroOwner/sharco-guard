name: Release Windows desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Confirm tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag v$version is required for this build." }
      - run: npm run desktop:package -- --publish never
      - name: Publish GitHub Release and updater assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Sharco Guard Setup *.exe
            dist/Sharco Guard Setup *.exe.blockmap
            dist/latest.yml
