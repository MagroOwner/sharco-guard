<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sharco Guard</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div class="mark">S</div><div><strong>SHARCO</strong><span>GUARD</span></div><p>Device security console</p></header>
<section class="hero"><div><p class="eyebrow">PROTECTION STATUS</p><h1 id="status">Ready to scan</h1><p id="detail">Your files stay on this device. Start a scan when you’re ready.</p></div><div class="shield">✓</div></section>
<section class="scan"><label for="path">Folder to scan</label><div class="controls"><input id="path" placeholder="C:\\Users\\alex\\Downloads" autocomplete="off"><button id="scan">Start scan</button></div><p class="note">Detects EICAR test files and identifies executable or script files for review.</p></section>
<section class="results"><div class="metric"><span>FILES SCANNED</span><b id="files">—</b></div><div class="metric"><span>THREATS</span><b id="threats">—</b></div><div class="metric"><span>REVIEW ITEMS</span><b id="review">—</b></div></section>
<section class="findings"><div class="section-title"><h2>Scan findings</h2><span id="time"></span></div><div id="list" class="empty">No scan has run yet.</div></section>
</main><script src="/app.js"></script></body></html>
